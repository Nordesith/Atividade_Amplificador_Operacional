<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPERAÇÃO AGV — Sinal Sob Controle</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --primary: #1f4e79;
        --primary-d: #163a5a;
        --accent: #ed7d31;
        --accent-d: #c96620;
        --bg: #fff;
        --bg-alt: #f5f5f5;
        --success: #70ad47;
        --alert: #c00000;
        --text: #263238;
        --muted: #607d8b;
        --border: #e0e0e0;
        --radius: 10px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      @keyframes pop {
        from {
          transform: translateX(-50%) translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateX(-50%) translateY(0);
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-30px);
        }
      }
      @keyframes xpPop {
        from {
          transform: scale(0);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes agvMove {
        0%,
        100% {
          transform: translateX(30px);
        }
        50% {
          transform: translateX(510px);
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg-alt);
        color: var(--text);
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        font-size: inherit;
      }
      h1,
      h2,
      h3,
      h4 {
        line-height: 1.25;
        color: var(--primary-d);
      }
      h2 {
        font-size: 1.4rem;
        margin-bottom: 0.75rem;
      }
      h3 {
        font-size: 1.15rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin-bottom: 0.7rem;
      }
      ul,
      ol {
        margin: 0.4rem 0 0.8rem 1.4rem;
      }
      li {
        margin-bottom: 0.3rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .fb[hidden] {
        display: none !important;
      }

      .topbar {
        background: var(--primary);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.7rem 1.2rem;
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 50;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .brand .logo {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-size: 1.1rem;
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 0.72rem;
        opacity: 0.8;
        letter-spacing: 0;
      }
      .nav {
        display: flex;
        gap: 0.2rem;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .nav button {
        color: #dce6f0;
        padding: 0.5rem 0.85rem;
        border-radius: 6px;
        font-size: 0.88rem;
      }
      .nav button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .nav button.active {
        background: var(--accent);
        color: #fff;
      }

      .main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 1.4rem 1rem 3rem;
      }
      .card {
        background: var(--bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.3rem 1.4rem;
        margin-bottom: 1.1rem;
        border: 1px solid var(--border);
      }
      .card-hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-bottom: 0.6rem;
      }
      .muted {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .pill {
        display: inline-block;
        padding: 0.18rem 0.6rem;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 600;
        background: #e8eff7;
        color: var(--primary);
      }
      .pill.warn {
        background: #fdecea;
        color: var(--alert);
      }
      .pill.ok {
        background: #e8f3e0;
        color: #4a7a2a;
      }
      .pill.acc {
        background: #fdeadd;
        color: var(--accent-d);
      }

      .img-frame {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem;
        margin: 0.9rem 0;
        text-align: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      }
      .img-frame svg {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      .img-caption {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 0.5rem;
        font-style: italic;
      }
      .img-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.9rem;
        margin: 0.9rem 0;
      }
      .img-grid .img-frame {
        margin: 0;
      }
      @media (max-width: 640px) {
        .img-grid {
          grid-template-columns: 1fr;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.55rem 1.05rem;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        transition: 0.15s;
        box-shadow: var(--shadow);
      }
      .btn:hover {
        background: var(--primary-d);
        transform: translateY(-1px);
      }
      .btn.acc {
        background: var(--accent);
      }
      .btn.acc:hover {
        background: var(--accent-d);
      }
      .btn.ghost {
        background: transparent;
        color: var(--primary);
        border: 1.5px solid var(--primary);
      }
      .btn.ghost:hover {
        background: #eef4fa;
      }
      .btn.sm {
        padding: 0.35rem 0.75rem;
        font-size: 0.8rem;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .hero {
        background: linear-gradient(135deg, var(--primary), #2a6398);
        color: #fff;
        border-radius: var(--radius);
        padding: 1.5rem 1.6rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1.1rem;
      }
      .hero h2 {
        color: #fff;
        font-size: 1.5rem;
        margin-bottom: 0.2rem;
      }
      .hero .avatar-big {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        display: grid;
        place-items: center;
        font-size: 2.6rem;
        border: 3px solid rgba(255, 255, 255, 0.4);
      }
      .name-input {
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        padding: 0.4rem 0.7rem;
        border-radius: 6px;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: 700;
        width: 100%;
        max-width: 340px;
        margin-top: 0.3rem;
      }
      .name-input:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.18);
      }
      .name-input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }
      .xpbar {
        height: 12px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 0.7rem;
        max-width: 420px;
      }
      .xpbar > div {
        height: 100%;
        background: var(--accent);
        transition: width 0.5s;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.8rem;
        margin-bottom: 1.1rem;
      }
      .stat {
        background: #fff;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1rem;
        border-top: 3px solid var(--accent);
      }
      .stat .num {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--primary);
      }
      .stat .lbl {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .badge-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 0.7rem;
      }
      .badge {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.8rem 0.6rem;
        text-align: center;
        font-size: 0.78rem;
        transition: 0.2s;
        cursor: help;
      }
      .badge.locked {
        opacity: 0.4;
        filter: grayscale(1);
      }
      .badge .ic {
        font-size: 1.6rem;
        display: block;
        margin-bottom: 0.25rem;
      }
      .badge .nm {
        font-weight: 600;
        font-size: 0.78rem;
      }
      .badge .hw {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 0.25rem;
        font-style: italic;
      }

      .map-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }
      .mod-card {
        background: #fff;
        border-radius: 12px;
        padding: 1.1rem;
        box-shadow: var(--shadow);
        position: relative;
        border-left: 5px solid var(--border);
        transition: 0.18s;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
      }
      .mod-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }
      .mod-card.done {
        border-left-color: var(--success);
      }
      .mod-card.available {
        border-left-color: var(--accent);
      }
      .mod-card.locked {
        opacity: 0.6;
        border-left-color: var(--muted);
      }
      .mod-card .num {
        position: absolute;
        top: 0.7rem;
        right: 0.8rem;
        font-size: 0.7rem;
        color: var(--muted);
        font-weight: 700;
      }
      .mod-card .icon {
        font-size: 1.9rem;
      }
      .mod-card h4 {
        font-size: 1.02rem;
        color: var(--primary-d);
      }
      .mod-card p {
        font-size: 0.82rem;
        color: var(--muted);
        margin: 0;
      }
      .mod-card .msep {
        font-size: 0.7rem;
        color: var(--accent-d);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .lesson {
        background: #fff;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.5rem 1.6rem;
        margin-bottom: 1rem;
        border: 1px solid var(--border);
      }
      .lesson .module-tag {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        font-size: 0.72rem;
        padding: 0.2rem 0.6rem;
        border-radius: 4px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
      }
      .lesson .msep-tag {
        display: inline-block;
        background: #fdeadd;
        color: var(--accent-d);
        font-size: 0.72rem;
        padding: 0.2rem 0.6rem;
        border-radius: 4px;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin-left: 0.4rem;
        margin-bottom: 0.5rem;
      }
      .callout {
        border-left: 4px solid var(--accent);
        background: #fff8f2;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        margin: 0.8rem 0;
        font-size: 0.9rem;
      }
      .callout.warn {
        border-color: var(--alert);
        background: #fdecea;
      }
      .callout.ok {
        border-color: var(--success);
        background: #f1f8ec;
      }
      .callout.info {
        border-color: var(--primary);
        background: #eef4fa;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.6rem 0;
        font-size: 0.88rem;
      }
      .table th,
      .table td {
        border: 1px solid var(--border);
        padding: 0.5rem 0.7rem;
        text-align: left;
      }
      .table th {
        background: #f1f4f7;
        font-weight: 600;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--primary-d);
      }
      .table tr:nth-child(even) td {
        background: #fafbfc;
      }
      .kbd {
        font-family: ui-monospace, Consolas, monospace;
        background: #f1f4f7;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.85em;
        color: var(--primary-d);
      }
      .formula {
        background: #f1f4f7;
        border-radius: 8px;
        padding: 0.65rem 0.9rem;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.95rem;
        margin: 0.5rem 0;
        border-left: 3px solid var(--primary);
      }

      .ia {
        background: #fafbfc;
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 1rem;
        margin: 0.9rem 0;
      }
      .ia .ia-title {
        font-weight: 700;
        color: var(--primary-d);
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .ia label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin: 0.4rem 0 0.15rem;
      }
      .ia input[type="range"] {
        width: 100%;
      }
      .ia .val {
        font-family: ui-monospace, Consolas, monospace;
        color: var(--accent-d);
        font-weight: 700;
      }
      .row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
        min-width: 180px;
      }
      canvas {
        max-width: 100%;
        display: block;
        border-radius: 8px;
        background: #0d1b2a;
        border: 1px solid #1a2c42;
      }

      .quiz-q {
        background: #fff;
        border-radius: 10px;
        padding: 1.1rem 1.2rem;
        margin-bottom: 0.9rem;
        border: 1px solid var(--border);
      }
      .quiz-q .qtext {
        font-weight: 600;
        margin-bottom: 0.6rem;
      }
      .quiz-opt {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.6rem 0.8rem;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        margin-bottom: 0.4rem;
        background: #fff;
        transition: 0.15s;
      }
      .quiz-opt:hover:not([disabled]) {
        border-color: var(--primary);
        background: #f7fafd;
      }
      .quiz-opt.correct {
        border-color: var(--success);
        background: #f1f8ec;
      }
      .quiz-opt.wrong {
        border-color: var(--alert);
        background: #fdecea;
      }
      .quiz-opt[disabled] {
        cursor: default;
        opacity: 0.7;
      }
      .fb {
        margin-top: 0.5rem;
        padding: 0.6rem 0.8rem;
        border-radius: 8px;
        font-size: 0.88rem;
      }
      .fb.ok {
        background: #f1f8ec;
        color: #3c6b1f;
        border-left: 3px solid var(--success);
      }
      .fb.no {
        background: #fdecea;
        color: #8a1a1a;
        border-left: 3px solid var(--alert);
      }
      .xp-gain {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 0.05rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-left: 0.4rem;
        animation: xpPop 0.4s ease-out;
      }

      .req-list {
        background: #fafbfc;
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 0.7rem 1rem;
        margin: 0.8rem 0;
      }
      .req-list .req-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.3rem 0;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .req-list .req-item.ok {
        color: #4a7a2a;
      }
      .req-list .req-ic {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: #e0e0e0;
        color: #fff;
        font-size: 0.75rem;
      }
      .req-list .req-item.ok .req-ic {
        background: var(--success);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.8rem;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
        color: var(--primary-d);
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 0.5rem 0.65rem;
        border: 1.5px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.9rem;
        background: #fff;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
      .field textarea {
        resize: vertical;
        min-height: 70px;
      }

      .tp-nav {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        margin-top: 1.2rem;
        flex-wrap: wrap;
      }
      .hint-box {
        background: #fff8e1;
        border-left: 3px solid #f0ad4e;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        margin: 0.5rem 0;
        font-size: 0.88rem;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 2rem 1rem;
        font-style: italic;
      }
      .tag-row {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin: 0.4rem 0;
      }
      .done-chk {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        padding: 0.4rem 0;
        cursor: pointer;
      }
      .done-chk input {
        width: 18px;
        height: 18px;
        accent-color: var(--success);
      }

      .ds-viewer {
        border: 1px solid var(--border);
        border-radius: 10px;
        margin: 1rem 0;
        overflow: hidden;
      }
      .ds-tabs {
        display: flex;
        background: #f1f4f7;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .ds-tabs button {
        flex: 1;
        padding: 0.6rem 0.8rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--primary);
        border-bottom: 3px solid transparent;
        min-width: 120px;
      }
      .ds-tabs button.active {
        border-bottom-color: var(--accent);
        background: #fff;
        color: var(--accent-d);
      }
      .ds-body {
        padding: 1rem;
        background: #fff;
        font-size: 0.9rem;
      }

      .agv-anim {
        animation: agvMove 4s ease-in-out infinite;
      }

      .cert-toolbar {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1.1rem;
        margin-bottom: 1rem;
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .cert-toolbar .name-set {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .cert-toolbar input {
        padding: 0.5rem 0.7rem;
        border: 1.5px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95rem;
        min-width: 220px;
      }
      .print-warning {
        background: #fff8e1;
        color: #8a5a00;
        padding: 0.5rem 0.9rem;
        border-radius: 6px;
        font-size: 0.82rem;
        border-left: 3px solid #f0ad4e;
      }
      .cert-wrap {
        background: #f5f5f5;
        padding: 1.2rem;
        border-radius: 10px;
        overflow-x: auto;
      }
      .cert {
        container-type: inline-size;
        position: relative;
        width: 100%;
        max-width: 1060px;
        min-width: 640px;
        aspect-ratio: 297/210;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        color: #263238;
        overflow: hidden;
      }
      .cert-frame {
        position: absolute;
        inset: 2.2cqw;
        border: 0.25cqw solid #1f4e79;

      function render() {
        const root = $("#root");
        let body = "";
        const view = state.view || "dashboard";
        switch (view) {
          case "dashboard":
            body = renderDashboard();
            break;
          case "map":
            body = renderMap();
            break;
          case "module":
            body = renderModule(state.currentModule);
            break;
          case "lab":
            body = renderLab();
            break;
          case "inventory":
            body = renderInventory();
            break;
          case "results":
            body = renderResults();
            break;
          case "certificate":
            body = renderCertificate();
            break;
          default:
            body = renderDashboard();
        }
        root.innerHTML = renderHeader() + `<main class="main">${body}</main>`;
        bindGlobal();
        bindView();
        syncHash();
        window.scrollTo(0, 0);
      }

      /* ==================== BINDINGS ==================== */
      function bindGlobal() {
        $$("[data-nav]").forEach((el) => {
          el.onclick = () => {
            const v = el.dataset.nav;
            if (v.startsWith("next-from-")) {
              const cur = +v.replace("next-from-", "");
              const next = cur + 1;
              if (next < MODULES.length) {
                state.currentModule = next;
                state.view = "module";
              } else {
                state.view = "certificate";
              }
            } else {
              state.view = v;
            }
            save();
            render();
          };
        });
        $$("[data-openmod]").forEach((el) => {
          el.onclick = () => {
            state.currentModule = +el.dataset.openmod;
            state.view = "module";
            save();
            render();
          };
        });
        const nameIn = $("#studentName");
        if (nameIn)
          nameIn.oninput = () => {
            state.student.name = nameIn.value;
            save();
          };
        const certName = $("#certName");
        if (certName)
          certName.oninput = () => {
            state.student.name = certName.value;
            save();
            applyCertName();
          };
        const printBtn = $("#printCert");
        if (printBtn)
          printBtn.onclick = () => {
            if (!state.student.name.trim()) {
              showToast("Digite seu nome para emitir o certificado.");
              if (certName) certName.focus();
              return;
            }
            window.print();
          };
        const resetBtn = $("#resetBtn");
        if (resetBtn)
          resetBtn.onclick = () => {
            if (
              !confirm(
                "Isso apagará TODO o progresso (XP, medalhas, módulos concluídos, medições, dossiê, reflexões). Deseja continuar?",
              )
            )
              return;
            localStorage.removeItem(STORAGE_KEY);
            state = getInitialState();
            state.view = "dashboard";
            save();
            render();
            showToast("Jornada reiniciada");
          };
      }

      function bindView() {
        if (state.view === "module") {
          const setup = SETUP_FNS[state.currentModule];
          if (setup) setup();
          renderQuiz(state.currentModule);
          updateCompletionUI(state.currentModule);
          const finishBtn = $("#finishMod");
          if (finishBtn) {
            finishBtn.onclick = () => {
              const cur = state.currentModule;
              const u = student();
              const mod = MODULES[cur];
              const reqs = checkRequirements(mod);
              const unmet = reqs.filter((r) => !r.done);
              if (unmet.length) {
                showToast("Falta: " + unmet.map((r) => r.label).join(" · "));
                return;
              }
              if (!u.completed.includes(cur)) {
                u.completed.push(cur);
                const BM = {
                  0: "primeira_missao",
                  1: "mestre_terminais",
                  2: "leitor_datasheets",
                  3: "cacador_ruidos",
                };
                if (BM[cur]) giveBadge(BM[cur]);
                awardXP(mod.xp);
                if (cur === MODULES.length - 1) {
                  giveBadge("engenheiro_integrador");
                  u.certificateDate =
                    u.certificateDate || new Date().toISOString();
                }
                save();
              }
              const next = cur + 1;
              if (next < MODULES.length) {
                state.currentModule = next;
                state.view = "module";
              } else {
                state.view = "certificate";
              }
              save();
              render();
            };
          }
        }
        if (state.view === "lab") setupLab();
      }

      function updateCompletionUI(moduleId) {
        const mod = MODULES[moduleId];
        if (!mod) return;
        const reqs = checkRequirements(mod);

      /* ==================== QUIZ ==================== */
      function renderQuiz(moduleId) {
        const m = MODULES.find((x) => x.id === moduleId);
        const u = student();
        const container = $("#quizArea");
        if (!container) return;

        let sessionStarted = false;
        const prevScore = u.quizScores[moduleId] || {
          best: 0,
          total: m.quiz.length,
          attempts: 0,
        };
        const cumSolved = (u.answeredQs[moduleId] || []).length;

        container.innerHTML =
          m.quiz
            .map((q, i) => {
              const alreadyCorrect = (u.answeredQs[moduleId] || []).includes(i);
              return `
      <fieldset class="quiz-q" data-q="${i}">
        <legend class="qtext">${i + 1}. ${esc(q.q)}</legend>
        <div role="radiogroup" aria-labelledby="q${i}-lbl">
          <span id="q${i}-lbl" class="sr-only">Pergunta ${i + 1}: ${esc(q.q)}</span>
          ${q.options
            .map((o, j) => {
              const isCorrect = j === q.correct;
              const cls = alreadyCorrect && isCorrect ? "correct" : "";
              return `<button class="quiz-opt ${cls}" data-qidx="${i}" data-oidx="${j}" ${alreadyCorrect ? 'disabled aria-disabled="true"' : ""}>${esc(o)}</button>`;
            })
            .join("")}
        </div>
        ${alreadyCorrect ? `<div class="fb ok">✓ Já respondida corretamente em sessão anterior.</div>` : `<div class="fb" hidden></div>`}
      </fieldset>`;
            })
            .join("") +
          `
    <div class="callout info" style="margin-top:.8rem">
      <strong>Progresso do checkpoint:</strong> <span id="qProg" aria-live="polite">${cumSolved}</span>/${m.quiz.length} corretas<br>
      <span class="muted" style="font-size:.85rem">Melhor resultado anterior: ${prevScore.best}/${prevScore.total}</span>
    </div>`;

        container
          .querySelectorAll(".quiz-opt:not([disabled])")
          .forEach((btn) => {
            btn.onclick = () => {
              const qi = +btn.dataset.qidx,
                oi = +btn.dataset.oidx;
              const q = m.quiz[qi];
              const wrap = btn.closest(".quiz-q");
              if (wrap.dataset.solved === "1") return;

              if (!sessionStarted) {
                sessionStarted = true;
                const cur = u.quizScores[moduleId] || {
                  best: cumSolved,
                  total: m.quiz.length,
                  attempts: 0,
                };
                cur.attempts = (cur.attempts || 0) + 1;
                cur.total = m.quiz.length;
                u.quizScores[moduleId] = cur;
              }

              const ok = oi === q.correct;
              const fb = wrap.querySelector(".fb");
              fb.hidden = false;

              if (ok) {
                wrap.dataset.solved = "1";
                wrap.querySelectorAll(".quiz-opt").forEach((b, idx) => {
                  b.disabled = true;
                  if (idx === q.correct) b.classList.add("correct");
                });
                fb.className = "fb ok";

                const wasNew = !(u.answeredQs[moduleId] || []).includes(qi);
                u.answeredQs[moduleId] = u.answeredQs[moduleId] || [];
                if (wasNew) {
                  u.answeredQs[moduleId].push(qi);
                  awardXP(XP_PER_CORRECT);
                }
                const cur = u.quizScores[moduleId];
                cur.best = u.answeredQs[moduleId].length;
                u.quizScores[moduleId] = cur;

                fb.innerHTML =
                  "✓ " +
                  esc(q.feedback.correct) +
                  (wasNew
                    ? ' <span class="xp-gain">+' + XP_PER_CORRECT + " XP</span>"
                    : "");
                $("#qProg").textContent = u.answeredQs[moduleId].length;

                const BM = {
                  1: "mestre_terminais",
                  2: "leitor_datasheets",
                  3: "cacador_ruidos",
                };
                if (
                  BM[moduleId] &&
                  u.answeredQs[moduleId].length === m.quiz.length
                )
                  giveBadge(BM[moduleId]);
                if (
                  u.answeredQs[moduleId].length === m.quiz.length &&
                  u.completed.length === 0 &&
                  moduleId === 0
                )
                  giveBadge("primeira_missao");
                save();
                updateCompletionUI(moduleId);
              } else {
                btn.disabled = true;
                btn.classList.add("wrong");
                fb.className = "fb no";
                fb.innerHTML =
                  "✗ " +
                  esc(q.feedback.wrong) +
                  ' <button class="btn sm" data-retry="' +
                  qi +
                  '" style="margin-left:.5rem">Tentar novamente</button>';
                fb.querySelector("[data-retry]").onclick = () => {
                  wrap.querySelectorAll(".quiz-opt").forEach((b) => {
                    b.disabled = false;
                    b.classList.remove("wrong", "correct");
                  });
                  fb.hidden = true;
                  fb.className = "fb";
                  fb.innerHTML = "";
                };
                save();
              }
            };
          });
      }

        });
      };

      /* ==================== COMPONENTES COMPARTILHADOS ==================== */
      function setupLab() {
        setupComparator(
          "#labVin",
          "#labVref",
          "#labVinV",
          "#labVrefV",
          "#labCmpOut",
        );
        setupGenerator(
          "#labWave",
          "#labFreq",
          "#labAmp",
          "#labDuty",
          "#labFreqV",
          "#labAmpV",
          "#labDutyV",
          "#labWaveCanvas",
        );
        setupOscilloscope(
          "#labOsVd",
          "#labOsTd",
          "#labOsVdV",
          "#labOsTdV",
          "#labOsCanvas",
          "#labOsCalc",
        );
        setupHysteresis(
          "#labTh",
          "#labTl",
          "#labThV",
          "#labTlV",
          "#labHistCanvas",
        );
      }

      function setupComparator(vInSel, vRefSel, vInLbl, vRefLbl, outSel) {
        const vin = $(vInSel),
          vref = $(vRefSel),
          out = $(outSel);
        if (!vin || !vref || !out) return;
        const update = () => {
          const v1 = parseFloat(vin.value),
            v2 = parseFloat(vref.value);
          $(vInLbl).textContent = v1.toFixed(1).replace(".", ",");
          $(vRefLbl).textContent = v2.toFixed(1).replace(".", ",");
          let stateTxt, cls;
          if (Math.abs(v1 - v2) < 0.05) {
            stateTxt = "INSTÁVEL (próximo do limiar)";
            cls = "#f0ad4e";
          } else if (v1 > v2) {
            stateTxt = "ALTO (saturação positiva)";
            cls = "#70AD47";
          } else {
            stateTxt = "BAIXO (saturação negativa)";
            cls = "#C00000";
          }
          out.innerHTML = `Vin = ${v1.toFixed(1)} V · Vref = ${v2.toFixed(1)} V → <strong style="color:${cls}">SAÍDA: ${stateTxt}</strong>`;
        };
        vin.oninput = update;
        vref.oninput = update;
        update();
      }

      function setupHysteresis(thSel, tlSel, thLbl, tlLbl, canvasSel) {
        const th = $(thSel),
          tl = $(tlSel),
          cv = $(canvasSel);
        if (!th || !tl || !cv) return;
        const clamp = (which) => {
          let TH = parseFloat(th.value),
            TL = parseFloat(tl.value);
          if (TH <= TL + 0.1) {
            if (which === "th") {
              TL = Math.max(0.5, TH - 0.2);
              tl.value = TL;
            } else {
              TH = Math.min(4.5, TL + 0.2);
              th.value = TH;
            }
          }
        };
        const draw = () => {
          const TH = parseFloat(th.value),
            TL = parseFloat(tl.value);
          $(thLbl).textContent = TH.toFixed(1).replace(".", ",");
          $(tlLbl).textContent = TL.toFixed(1).replace(".", ",");
          const ctx = cv.getContext("2d"),
            W = cv.width,
            H = cv.height,
            PH = 150;
          ctx.fillStyle = "#0d1b2a";
          ctx.fillRect(0, 0, W, H);
          const yS = (v) => PH - 6 - (v / 5) * (PH - 12);
          const hl = (y) => {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
          };
          ctx.strokeStyle = "#1e3348";
          ctx.lineWidth = 1;
          for (let i = 0; i <= 5; i++) hl(yS(i));
          const sig = [];
          for (let x = 0; x < W; x++)
            sig.push(
              2.0 +
                1.3 * Math.sin((x / W) * Math.PI * 3) +
                0.22 * Math.sin(x * 0.55) +
                0.14 * Math.sin(x * 1.31) +
                0.1 * Math.sin(x * 2.3),
            );
          const mid = (TH + TL) / 2;
          let a = sig[0] > mid,
            b = sig[0] > TH,
            ta = 0,
            tb = 0;
          const A = [],
            B = [];
          sig.forEach((v) => {
            const na = v > mid;
            if (na !== a) {
              ta++;
              a = na;
            }
            if (!b && v > TH) {
              b = true;
              tb++;
            } else if (b && v < TL) {
              b = false;
              tb++;
            }
            A.push(a);
            B.push(b);
          });
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = "#70AD47";
          hl(yS(TH));
          ctx.strokeStyle = "#C00000";
          hl(yS(TL));
          ctx.setLineDash([]);
          const trace = (arr, hi, lo, color) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            arr.forEach((v, x) => {
              const y = v ? hi : lo;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          };
          ctx.strokeStyle = "#ED7D31";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          sig.forEach((v, x) => {
            const y = yS(v);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
          trace(A, 170, 192, "#ff8a80");
          trace(B, 212, 234, "#4FC3F7");
          ctx.font = "11px sans-serif";
          ctx.fillStyle = "#e0e8ef";
          ctx.fillText(
            "Laranja: sinal com ruído · tracejados: limiar superior (verde) e inferior (vermelho)",
            8,
            14,
          );
          ctx.fillStyle = "#ff8a80";
          ctx.fillText(
            `Sem histerese (Vref = ${mid.toFixed(2).replace(".", ",")} V): ${ta} comutações`,
            8,
            166,
          );
          ctx.fillStyle = "#4FC3F7";
          ctx.fillText(`Com histerese: ${tb} comutações`, 8, 208);
        };
        th.oninput = () => {
          clamp("th");
          draw();
        };
        tl.oninput = () => {
          clamp("tl");
          draw();
        };
        draw();
      }

      function setupFilter(rSel, cSel, outSel) {
        const r = $(rSel),
          c = $(cSel),
          out = $(outSel);
        if (!r || !c || !out) return;
        const update = () => {
          const R = parseFloat(r.value) || 0.001;
          const C = parseFloat(c.value) || 0.001;
          const fc = 1 / (2 * Math.PI * R * 1000 * C * 1e-9);
          let disp;
          if (fc >= 1e6) disp = (fc / 1e6).toFixed(2) + " MHz";
          else if (fc >= 1e3) disp = (fc / 1e3).toFixed(2) + " kHz";
          else disp = fc.toFixed(2) + " Hz";
          out.textContent = `fc ≈ ${disp}  (R = ${R} kΩ, C = ${C} nF)`;
        };
        r.oninput = update;
        c.oninput = update;
        update();
      }

      function setupGenerator(
        waveSel,
        freqSel,
        ampSel,
        dutySel,
        freqLbl,
        ampLbl,
        dutyLbl,
        canvasSel,
      ) {
        const w = $(waveSel),
          f = $(freqSel),
          a = $(ampSel),
          d = $(dutySel);
        const cv = $(canvasSel);
        if (!cv) return;
        const draw = () => {
          if (w) $(freqLbl).textContent = f.value;
          if (a)
            $(ampLbl).textContent = parseFloat(a.value)
              .toFixed(1)
              .replace(".", ",");
          if (d) $(dutyLbl).textContent = d.value;
          const ctx = cv.getContext("2d");
          const W = cv.width,
            H = cv.height;
          ctx.fillStyle = "#0d1b2a";
          ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "#1e3348";
          for (let i = 1; i < 4; i++) {
            const y = (H / 4) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
          }
          const mid = H / 2;
          const amp = (parseFloat(a.value || 2.5) * (H / 2 - 10)) / 5;
          const freq = parseFloat(f.value || 1000);
          const duty = parseFloat(d.value || 50) / 100;
          const cycles = freq * 0.005;
          ctx.strokeStyle = "#ED7D31";
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let x = 0; x < W; x++) {
            const t = (x / W) * cycles;
            let v = 0;
            const type = w ? w.value : "square";
            if (type === "sine") {
              v = Math.sin(2 * Math.PI * t);
            } else if (type === "square") {
              v = t % 1 < duty ? 1 : -1;
            } else {
              const ph = t % 1;
              v =
                ph < duty
                  ? (ph / duty) * 2 - 1
                  : 1 - ((ph - duty) / (1 - duty)) * 2;
            }
            const y = mid - v * amp;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.fillStyle = "#e0e8ef";
          ctx.font = "11px sans-serif";
          ctx.fillText(
            `${freq} Hz · pico ${parseFloat(a.value).toFixed(1)} V · duty ${(duty * 100).toFixed(0)}% · janela 5 ms`,
            8,
            16,
          );
        };
        [w, f, a, d].forEach((el) => {
          if (el) {
            el.oninput = draw;
            el.onchange = draw;
          }
        });
        draw();
      }

      function setupOscilloscope(
        vdSel,
        tdSel,
        vdLbl,
        tdLbl,
        canvasSel,
        calcSel,
      ) {
        const vd = $(vdSel),
          td = $(tdSel),
          cv = $(canvasSel),
          calc = $(calcSel);
        if (!cv) return;
        const draw = () => {
          const Vd = parseFloat(vd.value),
            Td = parseFloat(td.value);
          $(vdLbl).textContent = Vd.toFixed(1).replace(".", ",");
          $(tdLbl).textContent = Td.toFixed(1).replace(".", ",");
          const ctx = cv.getContext("2d");
          const W = cv.width,
            H = cv.height;
          ctx.fillStyle = "#0d1b2a";
          ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "#1e3348";
          for (let i = 1; i < 10; i++) {
            const x = (W / 10) * i;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
          }
          for (let i = 1; i < 8; i++) {
            const y = (H / 8) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
          }
          const period_ms = 0.5;
          const divsX = 10;
          const totalTime = divsX * Td;
          const periodsVisible = totalTime / period_ms;
          const mid = H / 2;
          const amp = 2.5;
          const divsY = amp / Vd;
          const pxPerDiv = H / 8;
          const dv = Math.min(divsY, 3.9);
          const yHigh = mid - dv * pxPerDiv;
          const yLow = mid + dv * pxPerDiv;
          ctx.strokeStyle = "#ED7D31";
          ctx.lineWidth = 2;
          ctx.beginPath();
          const periodPx = W / periodsVisible;
          for (let x = 0; x < W; x++) {
            const ph = (x % periodPx) / periodPx;
            const y = ph < 0.5 ? yHigh : yLow;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.fillStyle = "#e0e8ef";
          ctx.font = "11px sans-serif";
          ctx.fillText(
            `Onda quadrada · amplitude ~${amp} V · período ${period_ms} ms`,
            8,
            16,
          );
          if (calc) {
            const T = period_ms / 1000;
            const f = 1 / T;
            calc.innerHTML = `Amplitude ≈ ${amp} V (${(amp / Vd).toFixed(1)} div × ${Vd} V/div)<br>Período = ${period_ms} ms · Frequência = <strong>${f.toFixed(0)} Hz</strong> · Duty cycle = 50%${divsY > 3.9 ? "<br><strong>⚠ Sinal fora da tela: aumente V/div.</strong>" : ""}`;
          }
        };
        vd.oninput = draw;
        td.oninput = draw;
        draw();
      }

      /* ==================== MEDIÇÕES ==================== */
      function renderMeasurements() {
        const u = student();
        const list = $("#mList");
        if (!list) return;
        if (!u.measurements.length) {
          list.innerHTML = '<p class="empty">Nenhuma medição registrada.</p>';
          return;
        }
        list.innerHTML = `<table class="table">
    <tr><th>Ponto</th><th>Grandeza</th><th>Valor</th><th>Condição</th><th>Instrumento</th><th>Esperado</th><th>Obs.</th><th></th></tr>
    ${u.measurements
      .map(
        (m) => `<tr>
      <td>${esc(m.tp)}</td><td>${esc(m.qty)}</td><td>${esc(m.val)} ${esc(m.unit)}</td>
      <td>${esc(m.cond || "—")}</td><td>${esc(m.instr || "—")}</td><td>${esc(m.exp || "—")}</td><td>${esc(m.obs || "—")}</td>
      <td><button class="btn ghost sm" data-del="${m.id}" title="Excluir medição">🗑</button></td>
    </tr>`,
      )
      .join("")}
  </table>`;
        list.querySelectorAll("[data-del]").forEach((b) => {
          b.onclick = () => {
            if (!confirm("Excluir esta medição?")) return;
            u.measurements = u.measurements.filter(
              (m) => String(m.id) !== b.dataset.del,
            );
            save();
            renderMeasurements();
            updateCompletionUI(7);
          };
        });
      }

      /* ==================== EXPORTAÇÃO ==================== */
      function downloadCSV(rows, filename) {
        const csv = rows.map((r) => r.map(sanitizeCell).join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csv], {
          type: "text/csv;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }
      function downloadText(text, filename) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      /* ==================== START ==================== */
      render();
    </script>
  </body>
